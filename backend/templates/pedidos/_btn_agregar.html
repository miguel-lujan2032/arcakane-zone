{% if user.is_authenticated %}
  {% if disponible %}
  <form method="post"
    action="{% url 'pedidos:agregar_al_carrito' oferta_id %}"
    hx-post="{% url 'pedidos:agregar_al_carrito' oferta_id %}"
    hx-target="#carrito-zona"
    hx-swap="innerHTML"
    hx-push-url="{% url 'pedidos:carrito' %}">
    {% csrf_token %}
    <button type="submit"
      class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold px-6 py-2 rounded-lg transition">
      🛒 Agregar al carrito
    </button>
  </form>
  {% else %}
  <button disabled class="w-full bg-gray-700 text-gray-500 font-semibold px-6 py-2 rounded-lg cursor-not-allowed">
    Sin stock
  </button>
  {% endif %}
{% else %}
  <a href="{% url 'login' %}?next={% url 'catalogo:detalle' videojuego_id %}"
    class="block text-center bg-purple-600 hover:bg-purple-500 text-white font-semibold px-6 py-2 rounded-lg">
    Inicia sesión para comprar
  </a>
{% endif %}
