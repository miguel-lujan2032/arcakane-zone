<div class="rounded-lg border px-4 py-3 text-sm mt-2
  {% if exito %}bg-green-950 border-green-700 text-green-100
  {% else %}bg-red-950 border-red-700 text-red-100{% endif %}">
  {{ mensaje }}
  {% if exito and pedido %}
  <div class="mt-3 flex flex-wrap gap-2">
    <a href="{% url 'pedidos:carrito' %}"
      class="bg-gray-700 hover:bg-gray-600 text-white text-xs px-3 py-1.5 rounded transition">
      Ver carrito
    </a>
    <a href="{% url 'pagos:checkout' pedido.pk %}"
      class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold px-3 py-1.5 rounded transition">
      Proceder al pago →
    </a>
  </div>
  <script>
    (function () {
      var s = document.getElementById('stock-num');
      if (s) { var n = parseInt(s.textContent, 10); if (n > 0) s.textContent = n - 1; }
    })();
  </script>
  {% endif %}
</div>
