{% extends "base.html" %}
{% block title %}Contraseña restablecida — Arkane Zone{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 text-center">

  <div class="text-5xl mb-4">✅</div>
  <h1 class="text-2xl font-bold text-green-400 mb-3">¡Contraseña restablecida!</h1>
  <p class="text-gray-300 text-sm mb-6">
    Tu contraseña fue actualizada correctamente. Ya puedes iniciar sesión con tu nueva contraseña.

  <a href="{% url 'login' %}"

    Iniciar sesión
  </a>

</div>
{% endblock %}
